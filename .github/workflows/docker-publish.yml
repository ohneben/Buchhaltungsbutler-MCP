name: Publish image & MCP Registry entry

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual run, to (re-)publish a version without cutting a new tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the image tag and registry entry, e.g. 1.0.3'
        required: true
        type: string

# Never run more than one publish per ref at a time.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # The release version is derived here once, from the tag, and then reused by
  # every job below. That way a release lives in exactly one place: the tag.
  version:
    name: determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      is_release: ${{ steps.pick.outputs.is_release }}
    steps:
      - name: Derive version from the ref
        id: pick
        env:
          # Via the environment rather than interpolated into the script text,
          # so the input cannot end up being run as shell code.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          IS_RELEASE=true
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            case "$GITHUB_REF" in
              refs/tags/v*)
                VERSION="${GITHUB_REF#refs/tags/v}"
                ;;
              *)
                # Not a release: mark the build with the commit it came from.
                VERSION="0.0.0-dev.g$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
                IS_RELEASE=false
                ;;
            esac
          fi
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "Unusable version: '$VERSION'" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (release: $IS_RELEASE)"

  publish:
    name: build & push to GHCR
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json is not the source of truth for the version; the tag is.
      # Stamping it here is what the server reports over MCP at runtime, so no
      # release ever needs a manual version bump in the repository.
      - name: Stamp the version into package.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "package.json is now at $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase image path.
          images: ghcr.io/ohneben/buchhaltungsbutler-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_release == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-mcp-registry:
    name: publish to MCP Registry
    needs: [version, publish]
    # The registry versions per release, not per commit.
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for the OIDC login to the registry
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Pin server.json to the released version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].identifier = "ghcr.io/ohneben/buchhaltungsbutler-mcp:" + $v
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            case "$OUTPUT" in
              *'cannot publish duplicate version'*)
                echo "::notice::This version is already in the registry, nothing to do."
                exit 0
                ;;
            esac
            exit "$STATUS"
          fi
