name: Publish image & MCP Registry entry

on:
  push:
    branches: [main]
    tags: ['v*']
  # Manueller Lauf, falls eine Version ohne neuen Tag (nach-)veroeffentlicht
  # werden muss. Die Version wird dann von Hand vorgegeben.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version fuer Image-Tag und Registry-Eintrag, z. B. 1.0.3'
        required: true
        type: string

# Never run more than one publish per ref at a time.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase image path.
          images: ghcr.io/ohneben/buchhaltungsbutler-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-mcp-registry:
    name: publish to MCP Registry
    needs: publish
    # Die Registry versioniert pro Release, nicht pro Commit: nur bei einem
    # v*-Tag oder bei einem manuellen Lauf mit vorgegebener Version.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # für die OIDC-Anmeldung an der Registry
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Pin server.json to the released version
        env:
          # Ueber die Umgebung statt per Interpolation in den Skripttext, damit
          # die Eingabe nicht als Shell-Code landen kann.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}"
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "Unbrauchbare Version: '$VERSION'" >&2
              exit 1
              ;;
          esac
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].identifier = "ghcr.io/ohneben/buchhaltungsbutler-mcp:" + $v
          ' server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            case "$OUTPUT" in
              *'cannot publish duplicate version'*)
                echo "::notice::Diese Version steht bereits in der Registry, nichts zu tun."
                exit 0
                ;;
            esac
            exit "$STATUS"
          fi
